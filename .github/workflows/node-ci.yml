name: node-ci

# Reusable CI for the npm/TypeScript repos (backend, mqtt, simulator, gateway,
# dashboard). Called from a repo's own .github/workflows/ci.yml — see
# callers/node.yml.

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "22"
      working-directory:
        description: Path to the package (repo root by default).
        type: string
        default: "."
      typecheck:
        description: 'Run `tsc --noEmit` before the tests.'
        type: boolean
        default: true
      test-command:
        type: string
        default: "npm test"
      run-build:
        description: 'Run `npm run build` after the tests.'
        type: boolean
        default: false

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: install
        working-directory: ${{ inputs.working-directory }}
        run: npm ci

      - name: typecheck
        if: ${{ inputs.typecheck }}
        working-directory: ${{ inputs.working-directory }}
        run: npx tsc --noEmit

      - name: test
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.test-command }}

      - name: build
        if: ${{ inputs.run-build }}
        working-directory: ${{ inputs.working-directory }}
        run: npm run build

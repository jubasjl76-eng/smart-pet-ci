name: pio-ci

# Reusable CI for smart-pet-device-sdk and the ported firmware repos.
# Runs the freestanding host tests, then a `pio run` matrix for each env.

on:
  workflow_call:
    inputs:
      environments:
        description: 'JSON array of PlatformIO envs to build, e.g. ["feeder","door","scale"].'
        type: string
        default: '["feeder","door","scale"]'
      project-dir:
        description: 'Directory holding platformio.ini (repo root by default).'
        type: string
        default: "."
      example-dir:
        description: >-
          If set (e.g. "examples"), each matrix job builds <example-dir>/<env>
          via PLATFORMIO_SRC_DIR — for a repo with one platformio.ini and many
          example sketches. Leave empty for repos whose sketch is src_dir.
        type: string
        default: ""
      native-test-command:
        description: 'Host test command, or "" to skip the native job. PlatformIO + gcovr are on PATH.'
        type: string
        default: "./test/run_native.sh"
      coverage-env:
        description: >-
          A PlatformIO test env built with --coverage; the native job runs it
          and `gcovr` and uploads coverage.xml. "" to skip.
        type: string
        default: ""
      wokwi-env:
        description: >-
          PlatformIO env to build and run under Wokwi CI (e.g. "feeder").
          "" to skip. Dormant unless the caller also has WOKWI_CLI_TOKEN set.
        type: string
        default: ""
      size-check:
        description: >-
          Report flash/RAM per env to the job summary (vs `firmware-size.json`)
          and gate on `-fstack-usage` single-frame budget.
        type: boolean
        default: false
      size-baseline:
        description: 'Committed baseline file: { "<env>": { "flash": N, "ram": N } }.'
        type: string
        default: "firmware-size.json"
      stack-budget-bytes:
        description: 'Fail if any src/ function has a single stack frame over this.'
        type: string
        default: "2048"
      size-strict:
        description: 'Also fail on a flash/RAM increase over the baseline (default: warn only).'
        type: boolean
        default: false
    secrets:
      WOKWI_CLI_TOKEN:
        required: false

jobs:
  native:
    if: ${{ inputs.native-test-command != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Cache PlatformIO
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-native-${{ runner.os }}-${{ hashFiles(format('{0}/platformio.ini', inputs.project-dir)) }}
          restore-keys: pio-native-${{ runner.os }}-
      - run: pip install --upgrade platformio gcovr
      - name: native tests
        working-directory: ${{ inputs.project-dir }}
        run: ${{ inputs.native-test-command }}
      - name: coverage
        if: ${{ inputs.coverage-env != '' }}
        working-directory: ${{ inputs.project-dir }}
        run: |
          pio test -e ${{ inputs.coverage-env }}
          gcovr --root . --filter 'src/' --xml-pretty -o coverage.xml --print-summary
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ inputs.coverage-env != '' }}
        with:
          name: native-coverage
          path: ${{ inputs.project-dir }}/coverage.xml
          retention-days: 7

  device:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(inputs.environments) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Cache PlatformIO
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles(format('{0}/platformio.ini', inputs.project-dir), format('{0}/library.json', inputs.project-dir)) }}
          restore-keys: pio-${{ runner.os }}-
      - run: pip install --upgrade platformio
      - name: pio run
        env:
          EXAMPLE_DIR: ${{ inputs.example-dir }}
          ENV_NAME: ${{ matrix.env }}
          PROJECT_DIR: ${{ inputs.project-dir }}
          SIZE_CHECK: ${{ inputs.size-check }}
        run: |
          if [ -n "$EXAMPLE_DIR" ]; then
            export PLATFORMIO_SRC_DIR="$EXAMPLE_DIR/$ENV_NAME"
            echo "PLATFORMIO_SRC_DIR=$PLATFORMIO_SRC_DIR"
          fi
          [ "$SIZE_CHECK" = "true" ] && export PLATFORMIO_BUILD_SRC_FLAGS="-fstack-usage"
          pio run -d "$PROJECT_DIR" -e "$ENV_NAME" 2>&1 | tee /tmp/pio.log

      - name: size report + stack budget
        if: ${{ inputs.size-check }}
        env:
          ENV_NAME: ${{ matrix.env }}
          PROJECT_DIR: ${{ inputs.project-dir }}
          BASELINE: ${{ inputs.size-baseline }}
          STACK_BUDGET: ${{ inputs.stack-budget-bytes }}
          SIZE_STRICT: ${{ inputs.size-strict }}
        run: |
          set -eu
          # PlatformIO prints "... used <N> bytes ..." for RAM then Flash.
          mapfile -t used < <(grep -oE 'used [0-9]+ bytes' /tmp/pio.log | grep -oE '[0-9]+')
          ram="${used[0]:-}"
          flash="${used[1]:-}"
          if [ -z "$flash" ] || [ -z "$ram" ]; then
            echo "::warning::could not parse size from the build log — skipping size report"
            exit 0
          fi
          bfile="$PROJECT_DIR/$BASELINE"
          bflash=$(jq -r --arg e "$ENV_NAME" '.[$e].flash // ""' "$bfile" 2>/dev/null || echo "")
          bram=$(jq -r --arg e "$ENV_NAME" '.[$e].ram // ""' "$bfile" 2>/dev/null || echo "")
          dflash=$([ -n "$bflash" ] && echo $((flash - bflash)) || echo "—")
          dram=$([ -n "$bram" ] && echo $((ram - bram)) || echo "—")
          {
            echo "### 📦 \`$ENV_NAME\` size"
            echo ""
            echo "| | bytes | baseline | Δ |"
            echo "|---|---:|---:|---:|"
            echo "| Flash | $flash | ${bflash:-—} | $dflash |"
            echo "| RAM | $ram | ${bram:-—} | $dram |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$bflash" ]; then
            echo "_No baseline for \`$ENV_NAME\` — seed \`$BASELINE\` with:_ \`{\"$ENV_NAME\":{\"flash\":$flash,\"ram\":$ram}}\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          grew=0
          [ -n "$bflash" ] && [ "$dflash" != "—" ] && [ "$dflash" -gt 2048 ] && grew=1
          [ -n "$bram" ] && [ "$dram" != "—" ] && [ "$dram" -gt 512 ] && grew=1
          if [ "$grew" = 1 ]; then
            echo "⚠️  size grew past the soft limit (flash +2048 / ram +512)" >> "$GITHUB_STEP_SUMMARY"
            [ "$SIZE_STRICT" = "true" ] && { echo "::error::firmware size regression on $ENV_NAME"; exit 1; }
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "#### Stack frames over ${STACK_BUDGET}B (src/ only)" >> "$GITHUB_STEP_SUMMARY"
          over=$(find ".pio/build/$ENV_NAME" -name '*.su' -not -path '*/libdeps/*' -exec cat {} + 2>/dev/null \
                 | awk -F'\t' -v b="$STACK_BUDGET" 'NF>=2 && ($2+0)>b {print "- `"$1"` — "$2" B"}' | sort -t' ' -k4 -rn || true)
          if [ -n "$over" ]; then
            echo "$over" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::stack frame over budget on $ENV_NAME"
            exit 1
          fi
          echo "_none_ ✅" >> "$GITHUB_STEP_SUMMARY"

  # Boots the built image on a simulated ESP32. No-op until the caller sets the
  # (free, OSS) WOKWI_CLI_TOKEN secret — see smart-pet-docs OPERATOR-ACTIONS G4.
  wokwi:
    if: ${{ inputs.wokwi-env != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: token gate
        id: gate
        env:
          TOK: ${{ secrets.WOKWI_CLI_TOKEN }}
        run: |
          if [ -n "$TOK" ]; then echo "on=1" >> "$GITHUB_OUTPUT"; else
            echo "WOKWI_CLI_TOKEN not set — skipping the Wokwi run."; fi
      - if: steps.gate.outputs.on
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - if: steps.gate.outputs.on
        run: pip install --upgrade platformio
      - if: steps.gate.outputs.on
        name: build ${{ inputs.wokwi-env }}
        env:
          EXAMPLE_DIR: ${{ inputs.example-dir }}
        run: |
          if [ -n "$EXAMPLE_DIR" ]; then
            export PLATFORMIO_SRC_DIR="$EXAMPLE_DIR/${{ inputs.wokwi-env }}"
          fi
          pio run -d "${{ inputs.project-dir }}" -e ${{ inputs.wokwi-env }}
      - if: steps.gate.outputs.on
        name: wokwi test
        uses: wokwi/wokwi-ci-action@11ddc3fe66a14fcd46683fb21ae5c77657ad4606 # v1
        with:
          token: ${{ secrets.WOKWI_CLI_TOKEN }}
          path: ${{ inputs.project-dir }}/.wokwi
          diagram_file: diagram.json
          scenario: scenario.yaml
          timeout: 20000

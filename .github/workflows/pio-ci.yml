name: pio-ci

# Reusable CI for smart-pet-device-sdk and the ported firmware repos.
# Runs the freestanding host tests, then a `pio run` matrix for each env.

on:
  workflow_call:
    inputs:
      environments:
        description: 'JSON array of PlatformIO envs to build, e.g. ["feeder","door","scale"].'
        type: string
        default: '["feeder","door","scale"]'
      project-dir:
        description: 'Directory holding platformio.ini (repo root by default).'
        type: string
        default: "."
      example-dir:
        description: >-
          If set (e.g. "examples"), each matrix job builds <example-dir>/<env>
          via PLATFORMIO_SRC_DIR — for a repo with one platformio.ini and many
          example sketches. Leave empty for repos whose sketch is src_dir.
        type: string
        default: ""
      native-test-command:
        description: 'Host test command, or "" to skip the native job. PlatformIO + gcovr are on PATH.'
        type: string
        default: "./test/run_native.sh"
      coverage-env:
        description: >-
          A PlatformIO test env built with --coverage; the native job runs it
          and `gcovr` and uploads coverage.xml. "" to skip.
        type: string
        default: ""

jobs:
  native:
    if: ${{ inputs.native-test-command != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-native-${{ runner.os }}-${{ hashFiles(format('{0}/platformio.ini', inputs.project-dir)) }}
          restore-keys: pio-native-${{ runner.os }}-
      - run: pip install --upgrade platformio gcovr
      - name: native tests
        working-directory: ${{ inputs.project-dir }}
        run: ${{ inputs.native-test-command }}
      - name: coverage
        if: ${{ inputs.coverage-env != '' }}
        working-directory: ${{ inputs.project-dir }}
        run: |
          pio test -e ${{ inputs.coverage-env }}
          gcovr --root . --filter 'src/' --xml-pretty -o coverage.xml --print-summary
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.coverage-env != '' }}
        with:
          name: native-coverage
          path: ${{ inputs.project-dir }}/coverage.xml
          retention-days: 7

  device:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(inputs.environments) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles(format('{0}/platformio.ini', inputs.project-dir), format('{0}/library.json', inputs.project-dir)) }}
          restore-keys: pio-${{ runner.os }}-
      - run: pip install --upgrade platformio
      - name: pio run
        env:
          EXAMPLE_DIR: ${{ inputs.example-dir }}
        run: |
          if [ -n "$EXAMPLE_DIR" ]; then
            export PLATFORMIO_SRC_DIR="$EXAMPLE_DIR/${{ matrix.env }}"
            echo "PLATFORMIO_SRC_DIR=$PLATFORMIO_SRC_DIR"
          fi
          pio run -d "${{ inputs.project-dir }}" -e ${{ matrix.env }}

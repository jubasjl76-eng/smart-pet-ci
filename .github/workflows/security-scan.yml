name: security-scan

# Reusable per-PR + weekly security battery (Phase 18, Part C · C2).
# All repos are public, so SARIF -> the repo Security tab is free. gitleaks is
# always a hard gate. Semgrep, Trivy and `npm audit` report only until
# `strict: true` — flip that per repo once its baseline is triaged.
#
# Caller: <repo>/.github/workflows/security.yml
#   permissions: { contents: read, security-events: write }
#   uses: jubasjl76-eng/smart-pet-ci/.github/workflows/security-scan.yml@main
#   with: { node: true, iac: false }
#
# Scanners run from pinned Docker images (semgrep, trivy) so there's no GitHub
# Action version drift to chase.

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: "."
      node:
        description: 'Run `npm audit` (repo has a package-lock.json).'
        type: boolean
        default: false
      audit-level:
        type: string
        default: "high"
      iac:
        description: 'Also run `trivy config` (Terraform / Dockerfiles / k8s).'
        type: boolean
        default: false
      strict:
        description: 'Fail the build on Semgrep / Trivy findings (default: report only).'
        type: boolean
        default: false
      semgrep-config:
        description: 'Extra Semgrep --config value(s) — a repo-local rules dir/file, appended to the registry packs.'
        type: string
        default: ""

permissions:
  contents: read
  security-events: write

env:
  SEMGREP_IMAGE: semgrep/semgrep:1.176.0
  TRIVY_IMAGE: aquasec/trivy:0.74.0

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: semgrep (registry packs — report only)
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" \
            semgrep scan \
              --config p/default --config p/secrets --config p/owasp-top-ten \
              --sarif --output semgrep.sarif --metrics=off \
              ${{ inputs.strict && '--error' || '' }} \
              "${{ inputs.working-directory }}"
      - uses: github/codeql-action/upload-sarif@v3
        if: ${{ !cancelled() }}
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      # Repo-local rules are curated and expected to pass — they always gate.
      # No --sarif here: `--error` only sets the exit code when a report file is
      # not also being written, and a hard gate needs no Security-tab entry.
      - name: semgrep (repo-local rules — blocking)
        if: ${{ inputs.semgrep-config != '' }}
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" \
            semgrep scan --config "${{ inputs.semgrep-config }}" \
              --error --metrics=off \
              "${{ inputs.working-directory }}"

  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: trivy fs (vulns + secrets)
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY_IMAGE" \
            fs --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed \
              --format sarif --output trivy-fs.sarif \
              --exit-code ${{ inputs.strict && '1' || '0' }} \
              "${{ inputs.working-directory }}"
      - uses: github/codeql-action/upload-sarif@v3
        if: ${{ !cancelled() }}
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
      - uses: actions/setup-node@v5
        if: ${{ inputs.node }}
        with:
          node-version: "22"
      - name: npm audit
        if: ${{ inputs.node }}
        # Runtime deps only. Non-blocking until `strict` — same baseline switch
        # as Semgrep / Trivy; the advisories still print to the job log.
        continue-on-error: ${{ !inputs.strict }}
        working-directory: ${{ inputs.working-directory }}
        run: npm audit --omit=dev --audit-level=${{ inputs.audit-level }}

  iac:
    if: ${{ inputs.iac }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: trivy config
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY_IMAGE" \
            config --severity HIGH,CRITICAL \
              --format sarif --output trivy-config.sarif \
              --exit-code ${{ inputs.strict && '1' || '0' }} \
              "${{ inputs.working-directory }}"
      - uses: github/codeql-action/upload-sarif@v3
        if: ${{ !cancelled() }}
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

name: deploy-ecs

# Reusable: build a service image, push to ECR, register a new task-def revision
# from the running one with the new image, optionally run a one-off migration
# task, roll the ECS service, and wait for it to stabilise. GitHub → AWS OIDC,
# no static keys.
#
# The caller passes role-to-assume (module.oidc gha_deploy_role_arns[<service>])
# and the names Terraform created.

on:
  workflow_call:
    inputs:
      service:
        description: 'ECS service name, e.g. "backend".'
        type: string
        required: true
      task-family:
        description: 'Task-def family, e.g. "smart-pet-dev-backend".'
        type: string
        required: true
      container-name:
        description: 'Container in the task def to swap the image on.'
        type: string
        required: true
      cluster:
        description: 'ECS cluster name, e.g. "smart-pet-dev".'
        type: string
        required: true
      ecr-repo:
        description: 'ECR repo name, e.g. "smart-pet/backend".'
        type: string
        required: true
      aws-region:
        type: string
        required: true
      role-to-assume:
        type: string
        required: true
      dockerfile:
        type: string
        default: "Dockerfile"
      build-context:
        type: string
        default: "."
      run-migrations:
        type: boolean
        default: false
      migration-command:
        description: 'JSON array, e.g. ''["node","dist/database/migrate.js"]''.'
        type: string
        default: '["node","dist/database/migrate.js"]'
      wait-for-stable:
        type: boolean
        default: true
      environment:
        description: 'GitHub Environment to bind the deploy job to (dev | staging | prod). Gates on its protection rules; `vars`/`secrets` resolve to that environment.'
        type: string
        default: ""
      sentry-project:
        description: 'Sentry project slug. Set to create a Sentry release on each deploy + stamp SENTRY_RELEASE on the task def. Empty = skip all Sentry steps.'
        type: string
        default: ""
      attest:
        description: 'Generate a CycloneDX SBOM + SLSA build provenance for the pushed image (Phase 18). Caller must also grant `attestations: write`.'
        type: boolean
        default: true
    secrets:
      SENTRY_AUTH_TOKEN:
        required: false
      SENTRY_ORG:
        required: false

permissions:
  id-token: write
  contents: read
  attestations: write # SLSA provenance + SBOM attestations (Phase 18)

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v5
        with:
          # full history so the Sentry release can associate commits (set_commits: auto)
          fetch-depth: ${{ inputs.sentry-project != '' && 0 || 1 }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.role-to-assume }}
          aws-region: ${{ inputs.aws-region }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: build + push
        id: build
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPO: ${{ inputs.ecr-repo }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_SHA::12}"
          IMAGE="$REGISTRY/$REPO:$TAG"
          docker build -f "${{ inputs.dockerfile }}" -t "$IMAGE" -t "$REGISTRY/$REPO:latest" "${{ inputs.build-context }}"
          docker push "$IMAGE"
          docker push "$REGISTRY/$REPO:latest"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE" | cut -d@ -f2)
          {
            echo "image=$IMAGE"
            echo "tag=$TAG"
            echo "name=$REGISTRY/$REPO"
            echo "digest=$DIGEST"
          } >> "$GITHUB_OUTPUT"

      # Supply-chain: a CycloneDX SBOM + SLSA build provenance bound to the image
      # digest, also pushed to ECR as OCI referrers (`gh attestation verify` /
      # `cosign verify-attestation`). Phase 18, Part C.
      - name: SBOM (CycloneDX)
        if: ${{ inputs.attest }}
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.build.outputs.image }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: sbom-${{ inputs.service }}-${{ steps.build.outputs.tag }}.cdx.json
      - name: attest build provenance
        if: ${{ inputs.attest }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.build.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: attest SBOM
        if: ${{ inputs.attest }}
        uses: actions/attest-sbom@v2
        with:
          subject-name: ${{ steps.build.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true

      - name: sentry release name
        id: sentry
        env:
          PROJECT: ${{ inputs.sentry-project }}
          TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          TAG: ${{ steps.build.outputs.tag }}
        run: |
          if [ -n "$PROJECT" ] && [ -n "$TOKEN" ]; then
            echo "release=$PROJECT@$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "release=" >> "$GITHUB_OUTPUT"
          fi

      - name: register new task definition
        id: taskdef
        env:
          IMAGE: ${{ steps.build.outputs.image }}
          RELEASE: ${{ steps.sentry.outputs.release }}
        run: |
          set -euo pipefail
          aws ecs describe-task-definition --task-definition "${{ inputs.task-family }}" \
            --query 'taskDefinition' --output json > current.json
          jq --arg img "$IMAGE" --arg name "${{ inputs.container-name }}" --arg rel "$RELEASE" '
            .containerDefinitions = (.containerDefinitions | map(
              if .name == $name then
                .image = $img
                | if $rel != "" then
                    .environment = (((.environment // []) | map(select(.name != "SENTRY_RELEASE")))
                                    + [{"name": "SENTRY_RELEASE", "value": $rel}])
                  else . end
              else . end))
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
          ' current.json > new.json
          NEW_ARN=$(aws ecs register-task-definition --cli-input-json file://new.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "arn=$NEW_ARN" >> "$GITHUB_OUTPUT"

      - name: run migrations
        if: ${{ inputs.run-migrations }}
        env:
          NEW_ARN: ${{ steps.taskdef.outputs.arn }}
        run: |
          set -euo pipefail
          NETCFG=$(aws ecs describe-services --cluster "${{ inputs.cluster }}" --services "${{ inputs.service }}" \
            --query 'services[0].networkConfiguration' --output json)
          TASK_ARN=$(aws ecs run-task --cluster "${{ inputs.cluster }}" --task-definition "$NEW_ARN" \
            --launch-type FARGATE --network-configuration "$NETCFG" --started-by "gha-migrate" \
            --overrides "{\"containerOverrides\":[{\"name\":\"${{ inputs.container-name }}\",\"command\":${{ inputs.migration-command }}}]}" \
            --query 'tasks[0].taskArn' --output text)
          echo "migration task: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster "${{ inputs.cluster }}" --tasks "$TASK_ARN"
          CODE=$(aws ecs describe-tasks --cluster "${{ inputs.cluster }}" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          echo "migration exit code: $CODE"
          [ "$CODE" = "0" ]

      - name: roll the service
        env:
          NEW_ARN: ${{ steps.taskdef.outputs.arn }}
        run: |
          set -euo pipefail
          aws ecs update-service --cluster "${{ inputs.cluster }}" --service "${{ inputs.service }}" \
            --task-definition "$NEW_ARN" >/dev/null
          echo "rolled ${{ inputs.service }} → $NEW_ARN"

      - name: wait for stable
        if: ${{ inputs.wait-for-stable }}
        run: |
          aws ecs wait services-stable --cluster "${{ inputs.cluster }}" --services "${{ inputs.service }}"

      # Create + finalize the Sentry release for this deploy, and associate the
      # commits since the last one. Skipped unless sentry-project + the token
      # are both set. Runtime release name matches (SENTRY_RELEASE on the task).
      - name: sentry release
        if: ${{ steps.sentry.outputs.release != '' }}
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ inputs.sentry-project }}
        with:
          version: ${{ steps.sentry.outputs.release }}
          environment: ${{ inputs.environment }}
          set_commits: auto
